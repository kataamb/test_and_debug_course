name: Test Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./src  # ← ВАЖНО!
        run: |
          pip install poetry
          poetry install --with dev

      - name: Run ruff
        working-directory: ./src  # ← ВАЖНО!
        run: poetry run ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./src  # ← ВАЖНО!
        run: |
          pip install poetry
          poetry install --with dev

      - name: Run unit tests
        working-directory: ./src  # ← ВАЖНО!
        run: |
          poetry run pytest tests/unit/ -v \
            --junitxml=test-results/unit-tests.xml \
            --cov=. --cov-report=xml:coverage-reports/unit-coverage.xml

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: src/test-results/  # ← путь с src/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: src/coverage-reports/  # ← путь с src/

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install docker compose  # ← ЭТО ВАЖНО!
        run: |
            sudo apt-get update
            sudo apt-get install -y docker-compose

      - name: Build test image
        working-directory: ./src  # ← ВАЖНО!
        run: docker build -f Dockerfile.test -t test-runner .

      - name: Clean docker cache  # ← ДОБАВЬ ЭТО!
        run: docker system prune -f

      - name: Build test image with no cache  # ← И ЭТО!
        run: docker build --no-cache -f Dockerfile.test -t test-runner .


      - name: Run integration tests
        working-directory: ./src  # ← ВАЖНО!
        run: |
          docker compose -f docker-compose.test.yml run --rm test-runner \
            ./scripts/test/run-integration-tests.sh

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: src/test-results/  # ← путь с src/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: src/coverage-reports/  # ← путь с src/

  report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate artifacts/ -o allure-report --clean

      - name: Deploy Allure report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          destination_dir: ${{ github.run_id }}