name: Test Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./src  # ← ВАЖНО!
        run: |
          pip install poetry
          poetry install --with dev

      - name: Run ruff
        working-directory: ./src  # ← ВАЖНО!
        run: poetry run ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./src  # ← ВАЖНО!
        run: |
          pip install poetry
          poetry install --with dev

      - name: Run unit tests
        working-directory: ./src  # ← ВАЖНО!
        run: |
          poetry run pytest tests/unit/ -v \
            --junitxml=test-results/unit-tests.xml \
            --alluredir=test-results/allure-results-unit \
            --cov=. --cov-report=xml:coverage-reports/unit-coverage.xml

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: src/test-results/  # ← путь с src/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: src/coverage-reports/  # ← путь с src/

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install docker compose  # ← ЭТО ВАЖНО!
        run: |
            sudo apt-get update
            sudo apt-get install -y docker-compose


      - name: Start test database
        working-directory: ./src
        run: |
            # Запускаем БД в фоне
            docker compose -f docker-compose.test.yml up -d postgres_test

      - name: Build test image
        working-directory: ./src
        run: docker build -f Dockerfile.test -t test-runner .
      

      - name: Run integration tests
        working-directory: ./src  # ← ВАЖНО!
        env:
          CI: true
        run: |
          docker compose -f docker-compose.test.yml run --rm test-runner \
            ./scripts/tests/run-integration-tests.sh

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: src/test-results/  # ← путь с src/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: src/coverage-reports/  # ← путь с src/

  report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Debug artifacts structure
        run: |
          echo "=== Artifacts structure ==="
          find artifacts -type f -name "*.json" | head -20
          echo "=== Allure results count ==="
          find artifacts -type d -name "allure-results" | wc -l
          echo "=== First allure-results content ==="
          find artifacts -type d -name "allure-results" -print -quit | xargs ls -la

      - name: Find allure-results
        run: |
          echo "=== Searching for allure-results ==="
          find artifacts -type d -name "allure-results" | head -10
          echo "=== Searching for any JSON files ==="
          find artifacts -name "*.json" | head -20

      #- name: Check unit-test allure-results
      #  run: |
      #    find artifacts/test-results/ -type d -name "allure-results-unit" -print
      #    find artifacts/test-results/allure-results-unit -type f -name "*.json"

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          mkdir merged-results
          # Копируем все содержимое каждой allure-results в merged-results
          #for dir in $(find artifacts -type d -name "allure-results*"); do
          #    cp -r "$dir"/. merged-results/
          #done
          for dir in $(find artifacts -type d -name "allure-results*"); do
              echo "Copying $dir"
              cp -r "$dir"/. merged-results/
          done
          allure generate merged-results/ -o allure-report --clean

      - name: Deploy Allure report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          destination_dir: ${{ github.run_id }}