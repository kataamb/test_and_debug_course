[project]
name = "src"
version = "0.1.0"
description = "course project"
authors = [
    {name = "Ekaterina Ambartsumova",email = "ekaterina.amba@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"

dependencies = [
    "fastapi (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "sqlalchemy[asyncio] (>=2.0.43,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "clickhouse-connect (>=0.9.1,<0.10.0)",
    "tasks (>=2.8.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "allure-pytest (>=2.15.3,<3.0.0)",
    "pysqlite3-binary (>=0.5.4.post2,<0.6.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
mypy = "^1.17.1"
ruff = "^0.12.9"
pytest = "^8.4.1"
types-python-jose = "^3.5.0.20250531"
allure-pytest = "^2.15.3"
allure-python-commons = "^2.15.3"


[tool.poetry.group.test.dependencies]
pytest-random-order = "^1.2.0"
allure-pytest = "^2.15.2"
faker = "^38.2.0"
testcontainers = "^4.13.3"
asgi-lifespan = "^2.1.0"

[tool.pytest.ini_options]
markers = [
    "integration: integration tests with real database",
    "unit: unit tests with mocks",
    "slow: slow running tests"
]