events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name localhost;

        # / — статика
        location / {
            root /usr/share/nginx/static;
            index index.html;
            try_files $uri /index.html;
        }

        #  /reserved 
        location /reserved/ {
            root /usr/share/nginx/static;
            index index.html;
            try_files $uri /index.html;
        }

	
	#  documentation
        location /documentation {
	    root /usr/share/nginx/static;
	    index README.md;
	    
	    
	    proxy_hide_header Content-Type;
	    
	    
	    add_header Content-Type "text/plain; charset=utf-8" always;
	    
	    
	    add_header Content-Disposition "inline" always;
	    
	    try_files $uri /README.md;
	}

	# managment
        location /management {
            root /usr/share/nginx/static;
            index management.html;
            try_files $uri /management.html;
        }
    
    
    	# API v1
	location /api/v1/ {
	    proxy_pass http://app:8000/;  #  $request_uri
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_redirect off;
	}

	# Swagger UI
	location /api/v1/docs {
	    proxy_pass http://app:8000/api/v1/docs;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_redirect off;
	}

	location /api/v1/v1-openapi.json {
	    proxy_pass http://app:8000/v1-openapi.json;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_redirect off;
	}


	
        location /legacy/ {
	    root /usr/share/nginx/static;
            index legacy.html;
            try_files $uri /legacy.html;
	}

        

        # pgAdmin
        location /admin {
    		return 302 http://localhost:8080;
	}

        # status
        location /status {
            stub_status;
            allow all;
        }

        
} }

