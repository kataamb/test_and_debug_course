version: '3.8'

services:
  database:
    image: postgres:15
    container_name: adverts_db_container_v1
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ../data_volumes:/var/lib/postgresql/data
      - ./data/csv_exports:/data_tables_uuid
    restart: unless-stopped
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3


  app:
    build: .
    container_name: adverts_app_container
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=1234
      - LOG_LEVEL=DEBUG
      - LOG_CONFIG=./log_config.json
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - my-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./static:/usr/share/nginx/static
    networks:
      - my-network
    depends_on: # ← ДОБАВЬ ЭТО
      - app              # ← Ждать запуска app
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8080:80"
    networks:
      - my-network
    depends_on:
      - database
    restart: unless-stopped

networks:
  my-network:
    driver: bridge


