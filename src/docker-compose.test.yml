version: '3.8'

services:
  postgres_test:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5439:5432"  # Важно: другой порт, чтобы не мешать локальной БД
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "max_connections=200"]


  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app/src
    depends_on:
      postgres_test:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:1234@postgres_test:5432/postgres
    volumes:
      - ./test-results:/app/test-results
      - ./coverage-reports:/app/coverage-reports