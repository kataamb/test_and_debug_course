events {
    worker_connections 1024;
}

http {
    upstream app_backend {
        server adverts_app_container:8000;  # ← Правильное имя контейнера!
    }

    server {
        listen 80;
        server_name localhost;

        # OpenAPI спецификация
        location /openapi.json {
            proxy_pass http://app_backend/openapi.json;
            proxy_set_header Host $host;
        }

        # Swagger UI статические файлы
        location /docs/ {
            proxy_pass http://app_backend/docs/;
            proxy_set_header Host $host;
        }

        # Swagger UI
        location /api/v1/docs {
            proxy_pass http://app_backend/docs;
            proxy_set_header Host $host;
        }

        # API endpoints
        location /api/v1/ {
            proxy_pass http://app_backend/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /api/v1;

            # Обработка редиректов
            proxy_redirect http://localhost/ http://localhost/api/v1/;
            proxy_redirect http://app:8000/ http://localhost/api/v1/;
        }

        location /admin/ {
            proxy_pass http://pgadmin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /admin;  # Важно для pgAdmin!

            # Дополнительные настройки для корректной работы
            proxy_redirect / /admin/;
            sub_filter_once off;
            sub_filter 'href="/' 'href="/admin/';
            sub_filter 'src="/' 'src="/admin/';
            sub_filter 'action="/' 'action="/admin/';
        }

        # Статика
        location / {
            return 200 "Nginx works! Swagger: /api/v1/docs";
            add_header Content-Type text/plain;
        }
    }
}